# Before the TLS certificate exists: answer the ACME challenge, never serve the app over plain HTTP.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        default_type text/plain;
        return 503 "AegisOps: TLS certificate is being provisioned. Retry in a minute.\n";
    }
}
