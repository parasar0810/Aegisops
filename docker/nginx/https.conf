limit_req_zone $binary_remote_addr zone=aegis_auth:10m rate=10r/m;

# Plain HTTP (open to the internet for Let's Encrypt): ACME challenge + redirect only.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;   # approve/verify calls wait for remediation + recovery checks

    # Brute-force protection on the login endpoint.
    location = /api/auth/token {
        limit_req zone=aegis_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aegisops:8000;
    }
    location / { proxy_pass http://aegisops:8000; }
}

# ShopFront (separate application) at shop.<domain>, same access rules as AegisOps.
server {
    listen 443 ssl;
    http2 on;
    server_name shop.__DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    resolver 127.0.0.11 valid=10s ipv6=off;   # start even when ShopFront is not deployed
    set $shop http://shopfront-web:80;
    location / {
        proxy_pass $shop;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 504 = @shop_down;
    }
    location @shop_down {
        default_type text/plain;
        return 503 "ShopFront is unavailable.\n";
    }
}
