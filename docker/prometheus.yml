global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: aegisops
    metrics_path: /api/metrics
    static_configs: [{targets: ["aegisops:8000"]}]
  - job_name: shopfront
    metrics_path: /internal/metrics
    static_configs: [{targets: ["shopfront-api:8000"]}]
  - job_name: demo-target
    static_configs: [{targets: ["demo-app:9000"]}]
