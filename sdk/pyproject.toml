[project]
name = "aegisops-sdk"
version = "1.0.0"
description = "Optional Python SDK for connecting applications to AegisOps."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aegisops_sdk"]
