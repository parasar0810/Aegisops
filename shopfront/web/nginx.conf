# ShopFront web tier: static React build + /api proxy. Internal API routes are not proxied.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: start even if the API is down
    set $api http://shopfront-api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri /index.html; }
}
